<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Quick Dictionary</title>
  <style>
    body {
      width: 250px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1e293b;
      margin: 0;
      background-color: #ffffff;
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: #2563eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    p {
      margin: 0;
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
    }
    .footer {
      margin-top: 16px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      border-top: 1px solid #f1f5f9;
      padding-top: 8px;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      h2 {
        color: #60a5fa;
      }
      p {
        color: #cbd5e1;
      }
      .footer {
        color: #64748b;
        border-top-color: #1e293b;
      }
    }
  </style>
</head>
<body>
  <h2>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
    </svg>
    Quick Dictionary
  </h2>
  <p>Select any word on a webpage to instantly see its meaning, pronunciation, and synonyms.</p>
  <div class="footer">Powered by Free Dictionary API</div>
</body>
</html>
